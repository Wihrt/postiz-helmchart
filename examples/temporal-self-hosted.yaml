# Example Temporal deployment values for self-hosted in same cluster
# Deploy in dedicated 'temporal' namespace
#
# Usage:
#   helm install temporal temporalio/temporal \
#     --namespace temporal \
#     --create-namespace \
#     --values examples/temporal-self-hosted.yaml

server:
  replicaCount: 1

  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512

      datastores:
        default:
          sql:
            driver: "postgres12"
            host: temporal-postgresql
            port: 5432
            database: temporal
            user: temporal
            password: temporal-password

        visibility:
          sql:
            driver: "postgres12"
            host: temporal-postgresql
            port: 5432
            database: temporal_visibility
            user: temporal
            password: temporal-password

web:
  enabled: true
  ingress:
    enabled: false # Set to true and configure for external access

# Deploy PostgreSQL for Temporal
postgresql:
  enabled: true
  auth:
    username: temporal
    password: temporal-password
    database: temporal

cassandra:
  enabled: false
elasticsearch:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
mysql:
  enabled: false
